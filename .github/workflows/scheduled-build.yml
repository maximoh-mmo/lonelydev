name: Build and Deploy

on:
  schedule:
    # Runs at 05:43 UTC every Monday and Friday
    - cron: '43 5 * * 1,5'
  workflow_dispatch: # Allows you to trigger this manually from the GitHub Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run translation and build
        run: npm run translate && npm run build
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          MICROSOFT_TRANSLATOR_KEY: ${{ secrets.MICROSOFT_TRANSLATOR_KEY }}

      - name: Trigger deploy
        run: |
          curl -X POST ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}

