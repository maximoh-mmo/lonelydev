<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" role="img" aria-labelledby="title desc">
  <title id="title">Achi Colorblind-Safe 4-Color Palettes and 14 Percent Canvas Margin</title>
  <desc id="desc">Comparison of Achi's four built-in accessible palettes: base_light, base_dark, base_high_contrast, and base_greyscale, demonstrating Circle vs. Rounded Square silhouette clarity across every palette.</desc>
  <rect width="920" height="500" rx="14" fill="#0F1216"/>

  <text x="460" y="40" fill="#F3F0E9" font-family="Inter, system-ui, sans-serif" font-size="19" font-weight="700" text-anchor="middle">4-Color Semantic Palettes &amp; Pre-Attentive Shape Asymmetry</text>
  <text x="460" y="64" fill="#9AA0A6" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">Player 1: Circle (●) · Player 2: Rounded Square (■, 0.22 corner radius) · 14% outer safety cushion around 1:1 grid</text>

  <!-- Card 1: base_light -->
  <g transform="translate(36, 90)">
    <rect width="412" height="180" rx="12" fill="#F5F3EF" stroke="#D1CDC4" stroke-width="1.5"/>
    <text x="20" y="32" fill="#1E2229" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">base_light (Okabe-Ito Contrast)</text>
    <text x="20" y="52" fill="#525866" font-family="ui-monospace, Consolas, monospace" font-size="11">BG #F5F3EF · Grid #1E2229 · P1 #2563EB · P2 #E05A2B</text>
    <!-- Mini board -->
    <g transform="translate(260, 26)">
      <rect width="128" height="128" rx="8" fill="none" stroke="#1E2229" stroke-opacity="0.2" stroke-dasharray="4 3"/>
      <g stroke="#1E2229" stroke-width="3" stroke-linecap="round">
        <line x1="18" y1="18" x2="110" y2="18"/><line x1="18" y1="64" x2="110" y2="64"/><line x1="18" y1="110" x2="110" y2="110"/>
        <line x1="18" y1="18" x2="18" y2="110"/><line x1="64" y1="18" x2="64" y2="110"/><line x1="110" y1="18" x2="110" y2="110"/>
        <line x1="18" y1="18" x2="110" y2="110"/><line x1="110" y1="18" x2="18" y2="110"/>
      </g>
      <circle cx="18" cy="18" r="12" fill="#1E2229"/><circle cx="18" cy="18" r="9" fill="#2563EB"/><circle cx="18" cy="18" r="4.5" fill="#F5F3EF"/>
      <circle cx="64" cy="64" r="12" fill="#1E2229"/><circle cx="64" cy="64" r="9" fill="#2563EB"/><circle cx="64" cy="64" r="4.5" fill="#F5F3EF"/>
      <rect x="98" y="6" width="24" height="24" rx="5" fill="#1E2229"/><rect x="101" y="9" width="18" height="18" rx="4" fill="#E05A2B"/>
      <rect x="6" y="98" width="24" height="24" rx="5" fill="#1E2229"/><rect x="9" y="101" width="18" height="18" rx="4" fill="#E05A2B"/>
    </g>
    <!-- Swatches -->
    <rect x="20" y="130" width="28" height="28" rx="6" fill="#F5F3EF" stroke="#1E2229"/>
    <rect x="56" y="130" width="28" height="28" rx="6" fill="#1E2229"/>
    <circle cx="106" cy="144" r="14" fill="#2563EB"/>
    <rect x="130" y="130" width="28" height="28" rx="6" fill="#E05A2B"/>
    <text x="20" y="102" fill="#1E2229" font-family="Inter, system-ui, sans-serif" font-size="12">14% outer margin cushion</text>
  </g>

  <!-- Card 2: base_dark -->
  <g transform="translate(472, 90)">
    <rect width="412" height="180" rx="12" fill="#16181D" stroke="#2D333F" stroke-width="1.5"/>
    <text x="20" y="32" fill="#E4E7EC" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">base_dark (OLED / Night)</text>
    <text x="20" y="52" fill="#9AA0A6" font-family="ui-monospace, Consolas, monospace" font-size="11">BG #16181D · Grid #E4E7EC · P1 #3B9EFF · P2 #FF8A3D</text>
    <g transform="translate(260, 26)">
      <rect width="128" height="128" rx="8" fill="none" stroke="#E4E7EC" stroke-opacity="0.2" stroke-dasharray="4 3"/>
      <g stroke="#E4E7EC" stroke-width="3" stroke-linecap="round">
        <line x1="18" y1="18" x2="110" y2="18"/><line x1="18" y1="64" x2="110" y2="64"/><line x1="18" y1="110" x2="110" y2="110"/>
        <line x1="18" y1="18" x2="18" y2="110"/><line x1="64" y1="18" x2="64" y2="110"/><line x1="110" y1="18" x2="110" y2="110"/>
        <line x1="18" y1="18" x2="110" y2="110"/><line x1="110" y1="18" x2="18" y2="110"/>
      </g>
      <circle cx="18" cy="18" r="12" fill="#E4E7EC"/><circle cx="18" cy="18" r="9" fill="#3B9EFF"/><circle cx="18" cy="18" r="4.5" fill="#16181D"/>
      <circle cx="64" cy="64" r="12" fill="#E4E7EC"/><circle cx="64" cy="64" r="9" fill="#3B9EFF"/><circle cx="64" cy="64" r="4.5" fill="#16181D"/>
      <rect x="98" y="6" width="24" height="24" rx="5" fill="#E4E7EC"/><rect x="101" y="9" width="18" height="18" rx="4" fill="#FF8A3D"/>
      <rect x="6" y="98" width="24" height="24" rx="5" fill="#E4E7EC"/><rect x="9" y="101" width="18" height="18" rx="4" fill="#FF8A3D"/>
    </g>
    <rect x="20" y="130" width="28" height="28" rx="6" fill="#16181D" stroke="#E4E7EC"/>
    <rect x="56" y="130" width="28" height="28" rx="6" fill="#E4E7EC"/>
    <circle cx="106" cy="144" r="14" fill="#3B9EFF"/>
    <rect x="130" y="130" width="28" height="28" rx="6" fill="#FF8A3D"/>
    <text x="20" y="102" fill="#E4E7EC" font-family="Inter, system-ui, sans-serif" font-size="12">1.25px CPU-feathered AA edges</text>
  </g>

  <!-- Card 3: base_high_contrast -->
  <g transform="translate(36, 294)">
    <rect width="412" height="180" rx="12" fill="#000000" stroke="#444444" stroke-width="1.5"/>
    <text x="20" y="32" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">base_high_contrast (WCAG AAA)</text>
    <text x="20" y="52" fill="#CCCCCC" font-family="ui-monospace, Consolas, monospace" font-size="11">BG #000000 · Grid #FFFFFF · P1 #FFE600 · P2 #00E5FF</text>
    <g transform="translate(260, 26)">
      <rect width="128" height="128" rx="8" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-dasharray="4 3"/>
      <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
        <line x1="18" y1="18" x2="110" y2="18"/><line x1="18" y1="64" x2="110" y2="64"/><line x1="18" y1="110" x2="110" y2="110"/>
        <line x1="18" y1="18" x2="18" y2="110"/><line x1="64" y1="18" x2="64" y2="110"/><line x1="110" y1="18" x2="110" y2="110"/>
        <line x1="18" y1="18" x2="110" y2="110"/><line x1="110" y1="18" x2="18" y2="110"/>
      </g>
      <circle cx="18" cy="18" r="12" fill="#FFFFFF"/><circle cx="18" cy="18" r="9" fill="#FFE600"/><circle cx="18" cy="18" r="4.5" fill="#000000"/>
      <circle cx="64" cy="64" r="12" fill="#FFFFFF"/><circle cx="64" cy="64" r="9" fill="#FFE600"/><circle cx="64" cy="64" r="4.5" fill="#000000"/>
      <rect x="98" y="6" width="24" height="24" rx="5" fill="#FFFFFF"/><rect x="101" y="9" width="18" height="18" rx="4" fill="#00E5FF"/>
      <rect x="6" y="98" width="24" height="24" rx="5" fill="#FFFFFF"/><rect x="9" y="101" width="18" height="18" rx="4" fill="#00E5FF"/>
    </g>
    <rect x="20" y="130" width="28" height="28" rx="6" fill="#000000" stroke="#FFFFFF"/>
    <rect x="56" y="130" width="28" height="28" rx="6" fill="#FFFFFF"/>
    <circle cx="106" cy="144" r="14" fill="#FFE600"/>
    <rect x="130" y="130" width="28" height="28" rx="6" fill="#00E5FF"/>
    <text x="20" y="102" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="12">640×640 orientation-invariant viewport</text>
  </g>

  <!-- Card 4: base_greyscale -->
  <g transform="translate(472, 294)">
    <rect width="412" height="180" rx="12" fill="#E2E2E2" stroke="#BDBDBD" stroke-width="1.5"/>
    <text x="20" y="32" fill="#141414" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700">base_greyscale (Achromatopsia Test)</text>
    <text x="20" y="52" fill="#3A3A3A" font-family="ui-monospace, Consolas, monospace" font-size="11">BG #E2E2E2 · Grid #141414 · P1 #2E2E2E · P2 #8A8A8A</text>
    <g transform="translate(260, 26)">
      <rect width="128" height="128" rx="8" fill="none" stroke="#141414" stroke-opacity="0.25" stroke-dasharray="4 3"/>
      <g stroke="#141414" stroke-width="3" stroke-linecap="round">
        <line x1="18" y1="18" x2="110" y2="18"/><line x1="18" y1="64" x2="110" y2="64"/><line x1="18" y1="110" x2="110" y2="110"/>
        <line x1="18" y1="18" x2="18" y2="110"/><line x1="64" y1="18" x2="64" y2="110"/><line x1="110" y1="18" x2="110" y2="110"/>
        <line x1="18" y1="18" x2="110" y2="110"/><line x1="110" y1="18" x2="18" y2="110"/>
      </g>
      <circle cx="18" cy="18" r="12" fill="#141414"/><circle cx="18" cy="18" r="9" fill="#2E2E2E"/><circle cx="18" cy="18" r="4.5" fill="#E2E2E2"/>
      <circle cx="64" cy="64" r="12" fill="#141414"/><circle cx="64" cy="64" r="9" fill="#2E2E2E"/><circle cx="64" cy="64" r="4.5" fill="#E2E2E2"/>
      <rect x="98" y="6" width="24" height="24" rx="5" fill="#141414"/><rect x="101" y="9" width="18" height="18" rx="4" fill="#8A8A8A"/>
      <rect x="6" y="98" width="24" height="24" rx="5" fill="#141414"/><rect x="9" y="101" width="18" height="18" rx="4" fill="#8A8A8A"/>
    </g>
    <rect x="20" y="130" width="28" height="28" rx="6" fill="#E2E2E2" stroke="#141414"/>
    <rect x="56" y="130" width="28" height="28" rx="6" fill="#141414"/>
    <circle cx="106" cy="144" r="14" fill="#2E2E2E"/>
    <rect x="130" y="130" width="28" height="28" rx="6" fill="#8A8A8A"/>
    <text x="20" y="102" fill="#141414" font-family="Inter, system-ui, sans-serif" font-size="12">100% legible with zero color cues</text>
  </g>
</svg>
