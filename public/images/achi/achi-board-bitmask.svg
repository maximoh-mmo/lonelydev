<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" role="img" aria-labelledby="title desc">
  <title id="title">Achi 9-Bit Bitboard Layout and 4-Token Encirclement Trap</title>
  <desc id="desc">Left: the 3x3 Achi graph with bitmask indices 0 through 8. Right: a 4-token encirclement trap where Player 1 Circles at nodes 0, 3, 4, 8 slide from node 0 to node 1 to leave Player 2 Rounded Squares at nodes 2, 5, 6, 7 with zero legal moves.</desc>
  <rect width="920" height="420" rx="14" fill="#16181D"/>
  <rect x="16" y="16" width="888" height="388" rx="10" fill="none" stroke="#2B313C" stroke-width="1.5"/>

  <!-- Left Panel: Bit Indices -->
  <text x="225" y="54" fill="#E4E7EC" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">9-Bit Graph Topology (Bits 0–8)</text>
  <text x="225" y="76" fill="#9AA0A6" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">p1_mask &amp; p2_mask pack board state into 9 bits (0..511)</text>

  <!-- Left Grid Lines -->
  <g stroke="#4B5563" stroke-width="4" stroke-linecap="round">
    <line x1="105" y1="120" x2="345" y2="120"/>
    <line x1="105" y1="225" x2="345" y2="225"/>
    <line x1="105" y1="330" x2="345" y2="330"/>
    <line x1="105" y1="120" x2="105" y2="330"/>
    <line x1="225" y1="120" x2="225" y2="330"/>
    <line x1="345" y1="120" x2="345" y2="330"/>
    <line x1="105" y1="120" x2="345" y2="330"/>
    <line x1="345" y1="120" x2="105" y2="330"/>
  </g>

  <!-- Left Nodes 0..8 -->
  <g font-family="ui-monospace, Consolas, monospace" text-anchor="middle">
    <!-- Row 0 -->
    <circle cx="105" cy="120" r="22" fill="#1E2229" stroke="#66F1F2" stroke-width="2.5"/>
    <text x="105" y="125" fill="#E4E7EC" font-size="14" font-weight="700">0</text>
    <text x="105" y="92" fill="#66F1F2" font-size="11">1&lt;&lt;0</text>

    <circle cx="225" cy="120" r="22" fill="#1E2229" stroke="#66F1F2" stroke-width="2.5"/>
    <text x="225" y="125" fill="#E4E7EC" font-size="14" font-weight="700">1</text>
    <text x="225" y="92" fill="#66F1F2" font-size="11">1&lt;&lt;1</text>

    <circle cx="345" cy="120" r="22" fill="#1E2229" stroke="#66F1F2" stroke-width="2.5"/>
    <text x="345" y="125" fill="#E4E7EC" font-size="14" font-weight="700">2</text>
    <text x="345" y="92" fill="#66F1F2" font-size="11">1&lt;&lt;2</text>

    <!-- Row 1 -->
    <circle cx="105" cy="225" r="22" fill="#1E2229" stroke="#66F1F2" stroke-width="2.5"/>
    <text x="105" y="230" fill="#E4E7EC" font-size="14" font-weight="700">3</text>
    <text x="66" y="229" fill="#66F1F2" font-size="11">1&lt;&lt;3</text>

    <circle cx="225" cy="225" r="24" fill="#1E2229" stroke="#F4B04F" stroke-width="3"/>
    <text x="225" y="230" fill="#F4B04F" font-size="15" font-weight="700">4</text>
    <text x="225" y="264" fill="#F4B04F" font-size="11">8-way hub</text>

    <circle cx="345" cy="225" r="22" fill="#1E2229" stroke="#66F1F2" stroke-width="2.5"/>
    <text x="345" y="230" fill="#E4E7EC" font-size="14" font-weight="700">5</text>
    <text x="385" y="229" fill="#66F1F2" font-size="11">1&lt;&lt;5</text>

    <!-- Row 2 -->
    <circle cx="105" cy="330" r="22" fill="#1E2229" stroke="#66F1F2" stroke-width="2.5"/>
    <text x="105" y="335" fill="#E4E7EC" font-size="14" font-weight="700">6</text>
    <text x="105" y="368" fill="#66F1F2" font-size="11">1&lt;&lt;6</text>

    <circle cx="225" cy="330" r="22" fill="#1E2229" stroke="#66F1F2" stroke-width="2.5"/>
    <text x="225" y="335" fill="#E4E7EC" font-size="14" font-weight="700">7</text>
    <text x="225" y="368" fill="#66F1F2" font-size="11">1&lt;&lt;7</text>

    <circle cx="345" cy="330" r="22" fill="#1E2229" stroke="#66F1F2" stroke-width="2.5"/>
    <text x="345" y="335" fill="#E4E7EC" font-size="14" font-weight="700">8</text>
    <text x="345" y="368" fill="#66F1F2" font-size="11">1&lt;&lt;8</text>
  </g>

  <!-- Divider -->
  <line x1="460" y1="40" x2="460" y2="380" stroke="#2B313C" stroke-width="1.5" stroke-dasharray="6 6"/>

  <!-- Right Panel: 4-Token Encirclement Trap -->
  <text x="690" y="54" fill="#E4E7EC" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" text-anchor="middle">4-Token Encirclement Trap (0 → 1)</text>
  <text x="690" y="76" fill="#9AA0A6" font-family="Inter, system-ui, sans-serif" font-size="13" text-anchor="middle">Sliding 0 → 1 leaves Square tokens (2, 5, 6, 7) with zero legal slides</text>

  <g stroke="#4B5563" stroke-width="4" stroke-linecap="round">
    <line x1="570" y1="120" x2="810" y2="120"/>
    <line x1="570" y1="225" x2="810" y2="225"/>
    <line x1="570" y1="330" x2="810" y2="330"/>
    <line x1="570" y1="120" x2="570" y2="330"/>
    <line x1="690" y1="120" x2="690" y2="330"/>
    <line x1="810" y1="120" x2="810" y2="330"/>
    <line x1="570" y1="120" x2="810" y2="330"/>
    <line x1="810" y1="120" x2="570" y2="330"/>
  </g>

  <!-- Move Arrow 0 -> 1 -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#66F1F2"/>
    </marker>
  </defs>
  <line x1="598" y1="120" x2="660" y2="120" stroke="#66F1F2" stroke-width="4" marker-end="url(#arrow)"/>

  <!-- Node 1: Empty Target -->
  <circle cx="690" cy="120" r="14" fill="#16181D" stroke="#66F1F2" stroke-width="2.5" stroke-dasharray="4 3"/>

  <!-- Player 1 Circles at 0 (pre-slide ghost + active), 3, 4, 8 -->
  <g>
    <!-- Node 0 (origin) -->
    <circle cx="570" cy="120" r="24" fill="#E4E7EC"/>
    <circle cx="570" cy="120" r="19" fill="#3B9EFF"/>
    <circle cx="570" cy="120" r="10" fill="none" stroke="#16181D" stroke-width="3.5"/>

    <!-- Node 3 -->
    <circle cx="570" cy="225" r="24" fill="#E4E7EC"/>
    <circle cx="570" cy="225" r="19" fill="#3B9EFF"/>
    <circle cx="570" cy="225" r="10" fill="none" stroke="#16181D" stroke-width="3.5"/>

    <!-- Node 4 -->
    <circle cx="690" cy="225" r="24" fill="#E4E7EC"/>
    <circle cx="690" cy="225" r="19" fill="#3B9EFF"/>
    <circle cx="690" cy="225" r="10" fill="none" stroke="#16181D" stroke-width="3.5"/>

    <!-- Node 8 -->
    <circle cx="810" cy="330" r="24" fill="#E4E7EC"/>
    <circle cx="810" cy="330" r="19" fill="#3B9EFF"/>
    <circle cx="810" cy="330" r="10" fill="none" stroke="#16181D" stroke-width="3.5"/>
  </g>

  <!-- Player 2 Rounded Squares at 2, 5, 6, 7 -->
  <g>
    <!-- Node 2 -->
    <rect x="787" y="97" width="46" height="46" rx="10" fill="#E4E7EC"/>
    <rect x="792" y="102" width="36" height="36" rx="8" fill="#FF8A3D"/>
    <rect x="800" y="110" width="20" height="20" rx="4" fill="none" stroke="#16181D" stroke-width="3"/>

    <!-- Node 5 -->
    <rect x="787" y="202" width="46" height="46" rx="10" fill="#E4E7EC"/>
    <rect x="792" y="207" width="36" height="36" rx="8" fill="#FF8A3D"/>
    <rect x="800" y="215" width="20" height="20" rx="4" fill="none" stroke="#16181D" stroke-width="3"/>

    <!-- Node 6 -->
    <rect x="547" y="307" width="46" height="46" rx="10" fill="#E4E7EC"/>
    <rect x="552" y="312" width="36" height="36" rx="8" fill="#FF8A3D"/>
    <rect x="560" y="320" width="20" height="20" rx="4" fill="none" stroke="#16181D" stroke-width="3"/>

    <!-- Node 7 -->
    <rect x="667" y="307" width="46" height="46" rx="10" fill="#E4E7EC"/>
    <rect x="672" y="312" width="36" height="36" rx="8" fill="#FF8A3D"/>
    <rect x="680" y="320" width="20" height="20" rx="4" fill="none" stroke="#16181D" stroke-width="3"/>
  </g>

  <!-- Legend / Status -->
  <text x="690" y="382" fill="#66F1F2" font-family="ui-monospace, Consolas, monospace" font-size="12" text-anchor="middle">has_any_legal_slide(opp_mask, 1&lt;&lt;0) == false → Instant Trap Win</text>
</svg>
