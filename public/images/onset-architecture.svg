<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Onset system architecture</title>
  <desc id="desc">Gameplay, simulation, and online data systems meeting at a server-authoritative C++ core.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#66f1f2" stroke-opacity=".08"/></pattern>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#10151a"/><stop offset="1" stop-color="#06080a"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/><rect width="1600" height="1000" fill="url(#grid)"/>
  <g font-family="Inter,Segoe UI,sans-serif">
    <text x="110" y="120" fill="#66f1f2" font-size="24" font-weight="700" letter-spacing="6">ONSET / SYSTEM FOUNDATION</text>
    <text x="110" y="205" fill="#f3f0e9" font-size="64" font-weight="700">Systems meet at authority.</text>
    <g transform="translate(110 300)">
      <g><rect width="410" height="310" rx="8" fill="#11171c" stroke="#f3f0e9" stroke-opacity=".2"/><text x="30" y="55" fill="#66f1f2" font-size="19" font-weight="700" letter-spacing="3">GAMEPLAY</text><text x="30" y="125" fill="#f3f0e9" font-size="28">Interaction &amp; input</text><text x="30" y="185" fill="#f3f0e9" font-size="28">Targeting</text><text x="30" y="245" fill="#f3f0e9" font-size="28">GAS combat</text></g>
      <g transform="translate(430)"><rect width="410" height="310" rx="8" fill="#11171c" stroke="#f3f0e9" stroke-opacity=".2"/><text x="30" y="55" fill="#66f1f2" font-size="19" font-weight="700" letter-spacing="3">AI &amp; SIMULATION</text><text x="30" y="125" fill="#f3f0e9" font-size="28">StateTree AI</text><text x="30" y="185" fill="#f3f0e9" font-size="28">Threat system</text><text x="30" y="245" fill="#f3f0e9" font-size="28">Spawning &amp; pooling</text></g>
      <g transform="translate(860)"><rect width="410" height="310" rx="8" fill="#11171c" stroke="#f3f0e9" stroke-opacity=".2"/><text x="30" y="55" fill="#66f1f2" font-size="19" font-weight="700" letter-spacing="3">ONLINE &amp; DATA</text><text x="30" y="125" fill="#f3f0e9" font-size="28">Identity &amp; auth</text><text x="30" y="185" fill="#f3f0e9" font-size="28">Persistence</text><text x="30" y="245" fill="#f3f0e9" font-size="28">Inventory &amp; loot</text></g>
    </g>
    <path d="M315 635v65M745 635v65M1175 635v65" stroke="#66f1f2" stroke-width="3" opacity=".7"/>
    <rect x="270" y="700" width="1060" height="150" rx="8" fill="#66f1f2" fill-opacity=".08" stroke="#66f1f2" stroke-opacity=".65"/>
    <text x="800" y="765" text-anchor="middle" fill="#f3f0e9" font-size="36" font-weight="700">Server-authoritative C++ core</text>
    <text x="800" y="815" text-anchor="middle" fill="#aaa9a4" font-size="24">Dedicated server / replication / RPCs / validated game state</text>
  </g>
</svg>
